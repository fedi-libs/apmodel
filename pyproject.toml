[project]
name = "apmodel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AmaseCocoa", email = "cocoa@amase.cc" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46.0.5",
    "multiformats>=0.3.1.post4",
    "niquests[http3]>=3.18.2",
    "pydantic>=2.12.5",
    "typing-extensions>=4.15.0",
    "lxml>=6.0.2",
]

[project.optional-dependencies]
speed = [
    "google-re2>=1.1.20251105",
]

[dependency-groups]
dev = [
    "hatch>=1.16.5",
    "jinja2>=3.1.6",
    "lxml-stubs>=0.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.9",
    "tox>=4.50.3",
    "tox-uv>=1.33.4",
]

[build-system]
requires = ["hatchling", "jinja2", "pyyaml", "niquests[http3]", "ruff"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/apmodel"
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/compile.py"

[tool.ruff]
line-length = 200
include = ["src/**/*.py", "tests/**/*.py"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 140

[tool.ruff.lint]
select = [
    "ANN", "B", "E", "F", "S", "I", "UP", "SIM", "ISC", "TID", 
    "BLE", "FBT", "T20", "PYI",
    "TCH",
    "FA",
    "PGH004",
    "RUF100"
]
ignore = ["TC001", "E501"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "ANN201",
]

[tool.pytest.ini_options]
addopts = "-m 'not full'"
markers = [
    "full: marks tests as slow/full-test (deselect with '-m \"not full\"')"
]

[tool.tox]
requires = ["tox-uv"]
env_list = ["py{310,311,312,313,314}"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
commands = [
    [
        "pytest", 
        "--cov=src/apmodel", 
        "--cov-branch", 
        "--cov-report=xml", 
        "--cov-report=term"
    ]
]

